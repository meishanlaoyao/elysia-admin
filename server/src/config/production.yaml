app:
  id: "Elysia-Admin"
  port: 3000
  prefix: "/api"
  staticDir: "public"
  staticPrefix: "/"
  baseCacheTime: 300
  forgetPasswordExpiresIn: 600
  forgetPasswordUrl: "http://192.168.2.112:3006/#/auth/reset-password"
  maxRequestBodySize: 10485760
  timeout: 30
  maxLoginAttempts: 3
  allowPublicRegister: false
  trustProxy: true
  trustedProxyCidrs:
    - "127.0.0.1"
    - "::1"
  corsOrigin:
    - "http://localhost:3006"
    # - "https://elysia-admin.top"
  corsMethods: "GET, PUT, POST, DELETE"
  corsAllowedHeaders: "authorization, content-type, accept"
  hsts: true
  geoIpTimeoutMs: 1500

jwt:
  accessToken:
    expiresIn: "15m"
    secret: "elysia-admin-accessToken"
  refreshToken:
    expiresIn: "7d"
    secret: "elysia-admin-refreshToken"

redis:
  # 多应用共库时 SCAN/Keys 会扫全 DB；建议本应用独占 db（如 1），勿与其它项目共用 0
  host: "localhost"
  port: 6379
  password: ""
  username: ""
  db: 0

pg:
  host: "localhost"
  port: 5432
  username: "postgres"
  user: "postgres"
  password: "123456"
  database: "elysia-admin"
  max: 10
  idle_timeout: 30
  connect_timeout: 10
  ssl: false

smtp:
  host: "smtp.qq.com"
  port: 465
  secure: true
  auth:
    user: ""
    pass: ""
  pool: true
  maxConnections: 10
  maxMessages: 100
  rateDelta: 1000
  rateLimit: 5

guard:
  ipBlacklist: true
  apiSwitch: true

orders:
  timeout: 900000

log:
  level: "info"
  showRequestParams: false

# 请求/响应加解密（RSA + AES-GCM）。生成密钥对（自动写入本文件，不会改 mode/routes）:
#  bun run gen:crypto-keys production   （已有密钥需加 --force 才会覆盖）
# 私钥切勿提交到仓库；PEM 也可手动用 YAML 块写法或单行 \n 写法填写。
# mode: off 不开启 | include 只加密 routes | exclude 除 routes 外全部加密
# routes: { method: "POST" 或 ["POST","PUT"] 或 "*", url: "/api/xx/*" }（url 中 * 匹配任意字符，method 须大写）
# 注意: 需加密的接口收到明文会返回 400；exclude 模式下第三方回调/webhook 须写入 routes
crypto:
  mode: "include"
  routes:
    - { method: "POST", url: "/api/auth/login" }
  privateKey: ""
  publicKey: ""